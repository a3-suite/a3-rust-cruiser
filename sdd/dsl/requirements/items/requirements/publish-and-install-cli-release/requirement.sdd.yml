version: 1
name: requirement
requirements:
  - requirement_id: publish-and-install-cli-release
    type: functional
    summary: 利用者が検証済みのCLI Releaseを取得して導入できる
    description: 承認されたrelease tagのsourceからCLI platform archiveとplatform installer script、manifestを組み立ててGitHub Releaseへ公開し、利用者がchecksum検証つきでCLIを導入・更新できるようにする
    rationale: 境界検証CLIを利用者が固定versionで再現可能に導入でき、配布物の改ざんを検知できるようにするため
    subject:
      namespace: a3-rust-cruiser
      key: cli-release-distribution
    priority: must
    fit_criteria:
      - 承認されたrelease tagからsource SHAとversionが一意に確定する
      - Linux x86_64、macOS arm64、Windows x86_64 の target-specific installer、各platform向けCLI archive、manifest、checksum一覧がGitHub Releaseへ公開される
      - 公開されるassetは承認済みrelease notesと同一のrelease identityへ結合され、既存Releaseまたはassetを上書きしない
      - target-specific installer は対応する固定manifestとCLI archiveをchecksumで検証する。事前取得入力を使うoffline実行を任意で選択できる
      - releaseごとの配置先はversionごとに分離され、同じmanaged rootで次のversionへのupgradeができる
      - 利用者がchecksumを検証してCLIを導入・更新でき、失敗時は未完了の理由と影響範囲を確認できる
      - CLIとセットで使う公開スキルのZIPとそのchecksumが、CLIと同じRelease identityで公開される
