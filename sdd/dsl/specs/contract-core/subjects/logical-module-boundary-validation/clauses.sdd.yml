version: 1
name: contract-clauses
subject_ref: subject.logical-module-boundary.validation
contracts:
  - id: contract.logical-module-boundary.dependency-graph
    summary: >-
      1回の解析はcompilationまたはsource-unionを持つ一意なAnalysisContextを使い、ModuleDeclarationを利用依存から分離し、
      import、re-export、解決済みpath-referenceだけをDependencyEdgeとして観測する。
      compilationはCargo manifest、選択feature、target tripleに対するrustc cfgを組み合わせたcompile条件を観測範囲とし、
      有効・無効を確定できるcfg、Cargo target dependency、optional dependencyを選別する。字句scope内のuse alias、local binding、
      同一moduleの宣言名、既知の依存中立macroとserdeを正規提供元とするderive、定義形状とmacro namespaceを一意に証明できる限定local macro、既知macroの引数内path、serdeの既知関数path属性、および同じ証明条件を満たす限定item macroの生成itemとpathを解決し、それでも未対応のmacro展開、cfg評価、名前解決が
      境界判定へ影響し得る場合だけ解析未完了とする。
      source-unionはsourceに記述された全cfg分岐を和集合として観測し、macroまたはattribute展開だけが生成する依存を観測範囲外とするが、明示的な内部参照を解決できない場合は解析未完了とする。
      includeとexcludeはBoundaryPolicyと同じLogicalModule ID patternを使い、include省略時は全moduleを候補とし、excludeを優先する。
      選択済みmoduleを依存元とし、内部依存先も選択済みの辺だけを保持するが、外部crate依存先は依存元が選択済みなら保持する。
      内部論理モジュールと外部crateを区別し、同一入力の集合と順序を決定的にする。
    external_document_refs:
      - document_id: dependency-cruiser-readme
        locator: What's this do?
      - document_id: dependency-cruiser-output-format
        locator: modules; dependencies
    conditions:
      - id: analysis-request-present
        input_predicate:
          kind: input
          term: input.analysis_request
          op: present
      - id: source-union-request-present
        input_predicate:
          kind: input
          term: input.analysis_request.source_union
          op: present
    guarantees:
      - id: analysis-context-present
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_context
      - id: analysis-profile-supported
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_context.analysis_profile
            right:
              kind: value_set
              values:
                - compilation
                - source-union
      - id: source-union-profile-selected
        when: source-union-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_context.analysis_profile
            right:
              kind: value_set
              values:
                - source-union
      - id: logical-modules-present
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.modules
      - id: module-declarations-separated
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.module_declarations
      - id: dependency-edges-present
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.dependencies
      - id: dependency-kind-supported
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.dependencies.kind
            right:
              kind: value_set
              values:
                - import
                - re-export
                - path-reference
      - id: dependency-target-scope-supported
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.dependencies.target_scope
            right:
              kind: value_set
              values:
                - internal-module
                - external-crate
      - id: excluded-scopes-present
        when: analysis-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.excluded_scopes
    verification_intents:
      - id: graph-observation
        goal: 解析条件、宣言包含、型付き依存辺、外部crate分類、除外範囲を決定的に観測できることを確認する
        guarantee_refs:
          - analysis-context-present
          - analysis-profile-supported
          - logical-modules-present
          - module-declarations-separated
          - dependency-edges-present
          - dependency-kind-supported
          - dependency-target-scope-supported
          - excluded-scopes-present
      - id: source-union-observation
        goal: source-unionがsourceに記述されたcfg分岐の依存を観測し、選択profileを結果へ明示することを確認する
        guarantee_refs:
          - analysis-context-present
          - analysis-profile-supported
          - source-union-profile-selected
          - dependency-edges-present

  - id: contract.logical-module-boundary.boundary-policy-input
    summary: >-
      CLIが受け取るBoundaryPolicy YAMLはrules配列をrootとし、各ruleは必須のid、kind、severityと、
      任意のfrom、to、modules、dependency_kinds配列を持つ。kindはforbidden、allowed、circular、
      severityはerror、warning、dependency_kindsはimport、re-export、path-referenceだけを受理する。
      任意配列の省略は空配列として扱う。forbiddenとallowedは空でないfromとtoだけを使用し、
      circularは空でないmodulesだけを使用する。patternは空でない`::`区切りのsegment列とし、
      各segmentにはliteral、`*`、`**`だけを受理する。未定義field、未対応enum、重複または
      kebab-caseでないid、kind別field制約またはpattern文法に反するruleは解析開始前の入力失敗として扱う。
      CLIはBoundaryPolicy YAMLまたはsdd-designs owner contractが定義する
      resolved-implementation-attribution version 1一時出力のいずれか一つを受け取り、入力源を相互排他的に扱う。
      owner出力は公開CLIから変換なしで受理し、そのshape、provenance、cardinality、帰属選択規則はowner contractに従う。
      不正なowner出力はRust dependency観測を開始する前に入力失敗として扱う。
      consumerはownerが解決済みのfile帰属、component dependency、scope dependencyを使用し、owner DSL、field binding、
      exactまたはdeepest directory規則、親directoryからの暗黙継承を再解釈または再計算しない。
      未観測fileの余剰entryは許可し、Rust module ID、covered module、unresolved moduleはconsumerが導出する。
      package、compilation target、target triple、features、cfg、analysis profile、include、excludeは公開CLIのconsumer-owned
      AnalysisContextとして独立に受理する。consumerは同じcheck内の一回のRust dependency観測から、
      全選択moduleの全source fileをexact pathでfile帰属へ結合し、全fileが同じowner tupleへ解決したmoduleだけをcoveredとする。
      file帰属の欠落、source fileなし、または一つのmodule内でowner tupleが競合する場合はunresolved coverageとして導出する。
      解決済みmoduleは同一component、同scope別component、cross-scopeの順に
      component dependencyまたはscope dependencyへ照合する。scope dependencyのcontract_refsはsubject_refとcontract_idの組を持ち、
      traceabilityだけに用いて依存許可条件にしない。
      帰属またはcoverageがunresolvedならconformantへ縮退させずindeterminate、禁止edgeを確定できればnon-conformantとする。
      owner一時出力は`--resolved-implementation-attribution`から既存loader、evaluator、reportへ渡し、owner DSLを再解釈せず、version 1入力をversion 2へ暗黙変換しない。
    conditions:
      - id: valid-boundary-policy-input
        input_predicate:
          kind: input
          term: input.valid_boundary_policy
          op: present
      - id: invalid-boundary-policy-input
        input_predicate:
          kind: input
          term: input.invalid_boundary_policy
          op: present
      - id: valid-resolved-implementation-attribution-input
        input_predicate:
          kind: input
          term: input.valid_resolved_implementation_attribution
          op: present
      - id: invalid-resolved-implementation-attribution-input
        input_predicate:
          kind: input
          term: input.invalid_resolved_implementation_attribution
          op: present
      - id: unresolved-implementation-attribution
        input_predicate:
          kind: input
          term: input.unresolved_implementation_attribution
          op: present
      - id: forbidden-resolved-attribution-edge
        input_predicate:
          kind: input
          term: input.forbidden_resolved_attribution_edge
          op: present
    guarantees:
      - id: valid-boundary-policy-input-accepted
        when: valid-boundary-policy-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "0"
                - "1"
                - "2"
      - id: invalid-boundary-policy-input-exits-with-three
        when: invalid-boundary-policy-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "3"
      - id: invalid-boundary-policy-input-keeps-stdout-empty
        when: invalid-boundary-policy-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stdout_status
            right:
              kind: value_set
              values:
                - empty
      - id: invalid-boundary-policy-input-writes-stderr-diagnostic
        when: invalid-boundary-policy-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stderr_status
            right:
              kind: value_set
              values:
                - diagnostic
      - id: resolved-attribution-coverage-is-reported
        when: valid-resolved-implementation-attribution-input
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.normalized_sdd_coverage
      - id: valid-resolved-implementation-attribution-input-accepted
        when: valid-resolved-implementation-attribution-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "0"
                - "1"
                - "2"
      - id: invalid-resolved-implementation-attribution-input-exits-with-three
        when: invalid-resolved-implementation-attribution-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "3"
      - id: invalid-resolved-implementation-attribution-input-reports-its-diagnostic-before-observation
        when: invalid-resolved-implementation-attribution-input
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stderr_diagnostic_source
            right:
              kind: value_set
              values:
                - resolved-implementation-attribution
      - id: unresolved-implementation-attribution-is-indeterminate
        when: unresolved-implementation-attribution
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - indeterminate
      - id: forbidden-resolved-attribution-edge-is-non-conformant
        when: forbidden-resolved-attribution-edge
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - non-conformant
    verification_intents:
      - id: boundary-policy-input-acceptance
        goal: 文書化されたBoundaryPolicy YAMLと任意配列の省略が入力失敗にならないことを確認する
        guarantee_refs:
          - valid-boundary-policy-input-accepted
      - id: boundary-policy-input-rejection
        goal: 未定義field、未対応enum、意味的に不正なrule、または入力源の組み合わせの不正が解析開始前の入力失敗になることを確認する
        guarantee_refs:
          - invalid-boundary-policy-input-exits-with-three
          - invalid-boundary-policy-input-keeps-stdout-empty
          - invalid-boundary-policy-input-writes-stderr-diagnostic
      - id: resolved-implementation-attribution-public-cli-semantics
        goal: 公開CLIが不正なowner-resolved入力をdependency観測前に拒否し、contextに束縛された有効なfile帰属を単一observer結果へexact joinして、全選択moduleのscope edge、unresolved、coverageを判定しschema 3で報告することを確認する
        guarantee_refs:
          - valid-resolved-implementation-attribution-input-accepted
          - invalid-resolved-implementation-attribution-input-exits-with-three
          - invalid-resolved-implementation-attribution-input-reports-its-diagnostic-before-observation
          - resolved-attribution-coverage-is-reported
          - unresolved-implementation-attribution-is-indeterminate
          - forbidden-resolved-attribution-edge-is-non-conformant
  - id: contract.logical-module-boundary.policy-evaluation
    summary: >-
      有効なBoundaryPolicyのforbiddenとallowedはfrom、toのpattern集合、circularはmodulesのpattern集合を使う。
      patternはLogicalModule IDの::区切りsegmentへ一致し、*は1 segment、**は0以上のsegment、その他の文字はliteralとして扱う。
      dependency_kinds省略時は全DependencyKindへ一致する。
      同じ依存に一致するforbidden ruleはすべて違反を生成し、適用可能なallowed rule群は許可先の和集合として評価する。
      forbiddenはallowedより優先し、circularは両者から独立して評価して、先に一致したruleだけで結果を隠さない。
    external_document_refs:
      - document_id: dependency-cruiser-rules-reference
        locator: forbidden; allowed; conditions
    conditions:
      - id: graph-and-policy-present
        input_predicate:
          kind: input
          term: input.graph_and_boundary_policy
          op: present
      - id: forbidden-and-allowed-match
        input_predicate:
          kind: input
          term: input.forbidden_and_allowed_match
          op: present
      - id: allowed-union-matches
        input_predicate:
          kind: input
          term: input.allowed_union_matches
          op: present
      - id: allowed-union-misses
        input_predicate:
          kind: input
          term: input.allowed_union_misses
          op: present
      - id: allowed-cycle-present
        input_predicate:
          kind: input
          term: input.allowed_cycle_present
          op: present
    guarantees:
      - id: violations-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations
      - id: violation-kind-supported
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.violations.kind
            right:
              kind: value_set
              values:
                - forbidden
                - not-allowed
                - circular
      - id: violation-rule-id-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.rule_id
      - id: violation-severity-supported
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.violations.severity
            right:
              kind: value_set
              values:
                - error
                - warning
      - id: violation-source-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.source
      - id: violation-target-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.target
      - id: violation-dependency-kind-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.dependency_kind
      - id: violation-source-evidence-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.evidence.path
      - id: violation-source-line-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.evidence.line
      - id: violation-source-column-present
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.evidence.column
      - id: all-forbidden-matches-evaluated
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.forbidden_match_handling
            right:
              kind: value_set
              values:
                - all-matches
      - id: allowed-targets-unioned
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.allowed_match_handling
            right:
              kind: value_set
              values:
                - union
      - id: cycle-evaluated-independently
        when: graph-and-policy-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.cycle_handling
            right:
              kind: value_set
              values:
                - independent
      - id: forbidden-overrides-allowed
        when: forbidden-and-allowed-match
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.dependency_outcome
            right:
              kind: value_set
              values:
                - forbidden
      - id: allowed-union-allows-dependency
        when: allowed-union-matches
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.dependency_outcome
            right:
              kind: value_set
              values:
                - allowed
      - id: allowed-union-rejects-dependency
        when: allowed-union-misses
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.dependency_outcome
            right:
              kind: value_set
              values:
                - not-allowed
      - id: allowed-cycle-dependencies-remain-allowed
        when: allowed-cycle-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.dependency_outcome
            right:
              kind: value_set
              values:
                - allowed
      - id: allowed-rules-do-not-suppress-cycle
        when: allowed-cycle-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.policy_evaluation.cycle_outcome
            right:
              kind: value_set
              values:
                - circular
      - id: circular-violation-cycle-path-present
        when: allowed-cycle-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations.cycle_path
    verification_intents:
      - id: forbidden-precedence
        goal: 一致した全forbidden ruleを評価し、allowedより優先することを確認する
        guarantee_refs:
          - violations-present
          - violation-kind-supported
          - violation-rule-id-present
          - violation-severity-supported
          - violation-source-present
          - violation-target-present
          - violation-dependency-kind-present
          - violation-source-evidence-present
          - violation-source-line-present
          - violation-source-column-present
          - all-forbidden-matches-evaluated
          - forbidden-overrides-allowed
      - id: allowed-union-acceptance
        goal: 適用可能なallowed ruleの許可先和集合が依存を許可することを確認する
        guarantee_refs:
          - violations-present
          - allowed-targets-unioned
          - allowed-union-allows-dependency
      - id: allowed-union-rejection
        goal: 許可先和集合に一致しない依存がnot-allowed違反になることを確認する
        guarantee_refs:
          - violations-present
          - violation-kind-supported
          - violation-rule-id-present
          - violation-severity-supported
          - violation-source-present
          - violation-target-present
          - violation-dependency-kind-present
          - violation-source-evidence-present
          - violation-source-line-present
          - violation-source-column-present
          - allowed-targets-unioned
          - allowed-union-rejects-dependency
      - id: circular-independent-evaluation
        goal: allowed依存であっても循環を独立して違反にすることを確認する
        guarantee_refs:
          - violations-present
          - violation-kind-supported
          - violation-rule-id-present
          - violation-severity-supported
          - violation-source-present
          - violation-target-present
          - violation-dependency-kind-present
          - violation-source-evidence-present
          - violation-source-line-present
          - violation-source-column-present
          - cycle-evaluated-independently
          - allowed-cycle-dependencies-remain-allowed
          - allowed-rules-do-not-suppress-cycle
          - circular-violation-cycle-path-present

  - id: contract.logical-module-boundary.validation-report
    summary: >-
      BoundaryViolationが1件でもあれば重大度によらずnon-conformantを最優先し、
      違反がなく現在policyへの影響がpossibleなAnalysisIssueが1件でもあればindeterminate、
      それ以外はAnalysisIssueが存在してもconformantとする。JSONとtextは同じ判断、違反、解析問題を表し、
      moduleはid、declarationはparent・child・evidence、dependencyはsource・target・kind・evidence、
      violationはrule_id・source・target・dependency_kind・evidence、analysis issueはcode・affected_scope・reasonに加え、
      観測結果と現在policyへの影響を独立した型付きfieldで保持する。確定依存と確定違反はAnalysisIssueへ複製しない。
      未解決依存候補では、sourceとdependency kindに適用可能なforbidden・circular ruleのうち、候補集合が空またはpatternに一致する候補を持つruleを
      影響し得るrule IDへ含める。allowed ruleは、候補集合が空、または許可先和集合に含まれない候補が1つでもある場合に、適用可能なrule IDを
      影響へ含め、候補集合が空でなく全候補が許可先和集合に含まれる場合は含めない。影響し得るruleがなければnone、1つ以上ならpossibleとする。
      候補target、dependency kind、rule ID、excluded scopeは文字列を比較keyとして昇順かつ重複なしで出力する。
    conditions:
      - id: complete-without-violation
        input_predicate:
          kind: input
          term: input.complete_without_violation
          op: present
      - id: complete-with-violation
        input_predicate:
          kind: input
          term: input.complete_with_violation
          op: present
      - id: possible-policy-impact
        input_predicate:
          kind: input
          term: input.analysis_issue_policy_impact_possible
          op: present
      - id: path-module-analysis-issue
        input_predicate:
          kind: input
          term: input.path_module_analysis_issue
          op: present
      - id: dependency-neutral-analysis-issue
        input_predicate:
          kind: input
          term: input.dependency_neutral_analysis_issue
          op: present
      - id: unresolved-dependency-analysis-issue
        input_predicate:
          kind: input
          term: input.unresolved_dependency_analysis_issue
          op: present
      - id: no-policy-impact-analysis-issue
        input_predicate:
          kind: input
          term: input.analysis_issue_policy_impact_none
          op: present
      - id: unresolved-candidate-allowed-union-matches
        input_predicate:
          kind: input
          term: input.unresolved_candidate_allowed_union_matches
          op: present
      - id: unresolved-candidate-allowed-union-misses
        input_predicate:
          kind: input
          term: input.unresolved_candidate_allowed_union_misses
          op: present
      - id: unresolved-candidate-targets-empty
        input_predicate:
          kind: input
          term: input.unresolved_candidate_targets_empty
          op: present
      - id: report-request-present
        input_predicate:
          kind: input
          term: input.report_request
          op: present
      - id: legacy-json-report-request
        input_predicate:
          kind: input
          term: input.legacy_json_report_request
          op: present
      - id: resolved-implementation-attribution-json-report-request
        input_predicate:
          kind: input
          term: input.resolved_implementation_attribution_json_report_request
          op: present
    guarantees:
      - id: conformant-decision
        when: complete-without-violation
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - conformant
      - id: non-conformant-decision
        when: complete-with-violation
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - non-conformant
      - id: indeterminate-decision
        when: possible-policy-impact
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - indeterminate
      - id: analysis-issue-has-possible-policy-impact
        when: possible-policy-impact
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - possible
      - id: possible-policy-impact-rule-ids-present
        when: possible-policy-impact
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues.policy_impact.rule_ids
      - id: path-module-source-module-present
        when: path-module-analysis-issue
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues.observation.source_module
      - id: path-module-policy-rule-ids-present
        when: path-module-analysis-issue
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues.policy_impact.rule_ids
      - id: json-schema-version-present
        when: legacy-json-report-request
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.schema_version
            right:
              kind: value_set
              values:
                - "2"
      - id: resolved-attribution-json-schema-version-is-three
        when: resolved-implementation-attribution-json-report-request
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.schema_version
            right:
              kind: value_set
              values:
                - "3"
      - id: analysis-issues-present
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues
      - id: analysis-issue-code-supported
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.code
            right:
              kind: value_set
              values:
                - analysis.unresolved-reference
                - analysis.unsupported-macro-expansion
                - analysis.unsupported-name-resolution
                - analysis.unsupported-syntax
                - analysis.unsupported-analysis-context
      - id: analysis-issue-reason-present
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues.reason
      - id: analysis-issue-affected-scope-present
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.analysis_issues.affected_scope
      - id: analysis-observation-outcome-supported
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.observation.outcome
            right:
              kind: value_set
              values:
                - unresolved-dependency-candidate
                - dependency-neutral
                - analysis-context-unresolved
                - component-attribution-unresolved
      - id: analysis-policy-impact-outcome-supported
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - none
                - possible
      - id: dependency-neutral-has-no-policy-impact
        when: dependency-neutral-analysis-issue
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - none
      - id: unresolved-dependency-observation
        when: unresolved-dependency-analysis-issue
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.observation.outcome
            right:
              kind: value_set
              values:
                - unresolved-dependency-candidate
      - id: analysis-issue-has-no-policy-impact
        when: no-policy-impact-analysis-issue
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - none
      - id: unresolved-candidate-allowed-union-match-has-no-policy-impact
        when: unresolved-candidate-allowed-union-matches
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - none
      - id: unresolved-candidate-allowed-union-miss-has-possible-policy-impact
        when: unresolved-candidate-allowed-union-misses
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - possible
      - id: unresolved-candidate-with-empty-targets-has-possible-policy-impact
        when: unresolved-candidate-targets-empty
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.analysis_issues.policy_impact.outcome
            right:
              kind: value_set
              values:
                - possible
      - id: report-serialization-supported
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.serialization
            right:
              kind: value_set
              values:
                - text
                - json
      - id: report-ordering-canonical
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.ordering
            right:
              kind: value_set
              values:
                - canonical
      - id: report-decision-supported
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: result.decision
            right:
              kind: value_set
              values:
                - conformant
                - non-conformant
                - indeterminate
      - id: report-violations-present
        when: report-request-present
        observation_ref: observation.validation.result
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: result.violations
    verification_intents:
      - id: decision-precedence
        goal: violation、policy impact possible、conformantの優先順で三状態判断が決まることを確認する
        guarantee_refs:
          - conformant-decision
          - non-conformant-decision
          - indeterminate-decision
      - id: analysis-issue-classification
        goal: 各stable codeのAnalysisIssueが観測結果、現在policyへの影響、理由、影響範囲へ接続されることを確認する
        guarantee_refs:
          - conformant-decision
          - indeterminate-decision
          - analysis-issues-present
          - analysis-issue-code-supported
          - analysis-issue-reason-present
          - analysis-issue-affected-scope-present
          - analysis-observation-outcome-supported
          - analysis-policy-impact-outcome-supported
          - dependency-neutral-has-no-policy-impact
          - unresolved-dependency-observation
          - analysis-issue-has-no-policy-impact
          - analysis-issue-has-possible-policy-impact
          - possible-policy-impact-rule-ids-present
          - unresolved-candidate-allowed-union-match-has-no-policy-impact
          - unresolved-candidate-allowed-union-miss-has-possible-policy-impact
          - unresolved-candidate-with-empty-targets-has-possible-policy-impact
          - path-module-source-module-present
          - path-module-policy-rule-ids-present
      - id: json-report-projection
        goal: 共通の検証結果をcanonical順序のJSONへ直列化することを確認する
        guarantee_refs:
          - json-schema-version-present
          - resolved-attribution-json-schema-version-is-three
          - analysis-issues-present
          - analysis-issue-code-supported
          - analysis-issue-reason-present
          - analysis-issue-affected-scope-present
          - analysis-observation-outcome-supported
          - analysis-policy-impact-outcome-supported
          - report-serialization-supported
          - report-ordering-canonical
          - report-decision-supported
          - report-violations-present
      - id: text-report-projection
        goal: JSONと同じ共通の検証結果をcanonical順序のtextへ直列化することを確認する
        guarantee_refs:
          - analysis-issues-present
          - analysis-issue-code-supported
          - analysis-issue-reason-present
          - analysis-issue-affected-scope-present
          - analysis-observation-outcome-supported
          - analysis-policy-impact-outcome-supported
          - report-serialization-supported
          - report-ordering-canonical
          - report-decision-supported
          - report-violations-present

  - id: contract.logical-module-boundary.cli-outcome
    summary: >-
      CLIはconformantを0、non-conformantを1、indeterminateを2、
      不正な呼出し、読込不能または契約不適合のBoundaryPolicy、その他の実行失敗を3へ写像する。
      helpとversionは情報を標準出力へ返して0で終了する。完了した解析だけがtextまたはJSONの検証結果を
      標準出力へ返し、実行失敗の説明は標準エラーへ返す。
    conditions:
      - id: conformant-result
        input_predicate:
          kind: input
          term: input.validation_decision.conformant
          op: present
      - id: non-conformant-result
        input_predicate:
          kind: input
          term: input.validation_decision.non_conformant
          op: present
      - id: indeterminate-result
        input_predicate:
          kind: input
          term: input.validation_decision.indeterminate
          op: present
      - id: cli-execution-failure
        input_predicate:
          kind: input
          term: input.cli_execution_failure
          op: present
      - id: completed-validation-result
        input_predicate:
          kind: input
          term: input.completed_validation_result
          op: present
      - id: cli-information-request
        input_predicate:
          kind: input
          term: input.cli_information_request
          op: present
    guarantees:
      - id: conformant-exit-code
        when: conformant-result
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "0"
      - id: non-conformant-exit-code
        when: non-conformant-result
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "1"
      - id: indeterminate-exit-code
        when: indeterminate-result
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "2"
      - id: execution-failure-exit-code
        when: cli-execution-failure
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "3"
      - id: completed-result-written-to-stdout
        when: completed-validation-result
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stdout_status
            right:
              kind: value_set
              values:
                - validation-result
      - id: completed-result-keeps-stderr-empty
        when: completed-validation-result
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stderr_status
            right:
              kind: value_set
              values:
                - empty
      - id: execution-failure-keeps-stdout-empty
        when: cli-execution-failure
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stdout_status
            right:
              kind: value_set
              values:
                - empty
      - id: execution-failure-writes-stderr-diagnostic
        when: cli-execution-failure
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stderr_status
            right:
              kind: value_set
              values:
                - diagnostic
      - id: cli-information-exit-code
        when: cli-information-request
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.exit_code
            right:
              kind: value_set
              values:
                - "0"
      - id: cli-information-written-to-stdout
        when: cli-information-request
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stdout_status
            right:
              kind: value_set
              values:
                - information
      - id: cli-information-keeps-stderr-empty
        when: cli-information-request
        observation_ref: observation.cli.process-outcome
        claim:
          kind: value-relation
          op: in
          relation:
            left:
              kind: observation_field
              value: process.stderr_status
            right:
              kind: value_set
              values:
                - empty
    verification_intents:
      - id: cli-exit-code-mapping
        goal: 三状態判断とCLI実行失敗が重複しない終了コードへ写像されることを確認する
        guarantee_refs:
          - conformant-exit-code
          - non-conformant-exit-code
          - indeterminate-exit-code
          - execution-failure-exit-code
          - completed-result-written-to-stdout
          - completed-result-keeps-stderr-empty
          - execution-failure-keeps-stdout-empty
          - execution-failure-writes-stderr-diagnostic
      - id: cli-information-output
        goal: root help、check help、versionが情報を標準出力へ返して正常終了することを確認する
        guarantee_refs:
          - cli-information-exit-code
          - cli-information-written-to-stdout
          - cli-information-keeps-stderr-empty
