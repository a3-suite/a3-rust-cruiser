  - id: contract.logical-module-boundary.cli-outcome
    summary: CLIはconformantを0、non-conformantを1、indeterminateを2、 不正な呼出し、読込不能または契約不適合のBoundaryPolicy、その他の実行失敗を3へ写像する。 helpとversionは情報を標準出力へ返して0で終了する。完了した解析だけがtextまたはJSONの検証結果を 標準出力へ返し、実行失敗の説明は標準エラーへ返す。
    observations:
      - boundary: boundary.cli-result
        summary: CLIプロセスが返す終了状態と標準streamの種別
        surface: process exit status
        fields:
          - selector: process.exit_code
            meaning: ValidationDecisionまたはCLI実行失敗を表す終了コード
          - selector: process.stdout_status
            meaning: validation-result、informationまたはemptyで表す標準出力の状態
          - selector: process.stderr_status
            meaning: diagnosticまたはemptyで表す標準エラーの状態
    conditions:
      - input: cli-information-request
      - input: conformant-result
      - input: non-conformant-result
      - input: indeterminate-result
      - input: cli-execution-failure
    guarantees:
      - id: exit-code-zero
        applies_to:
          - cli-information-request
          - conformant-result
        claim: {field: process.exit_code, in: ['0']}
      - id: non-conformant-exit-code
        applies_to:
          - non-conformant-result
        claim: {field: process.exit_code, in: ['1']}
      - id: indeterminate-exit-code
        applies_to:
          - indeterminate-result
        claim: {field: process.exit_code, in: ['2']}
      - id: execution-failure-exit-code
        applies_to:
          - cli-execution-failure
        claim: {field: process.exit_code, in: ['3']}
      - id: completed-result-written-to-stdout
        applies_to:
          - conformant-result
          - non-conformant-result
          - indeterminate-result
        claim: {field: process.stdout_status, in: [validation-result]}
      - id: stderr-empty
        applies_to:
          - cli-information-request
          - conformant-result
          - non-conformant-result
          - indeterminate-result
        claim: {field: process.stderr_status, in: [empty]}
      - id: execution-failure-keeps-stdout-empty
        applies_to:
          - cli-execution-failure
        claim: {field: process.stdout_status, in: [empty]}
      - id: execution-failure-writes-stderr-diagnostic
        applies_to:
          - cli-execution-failure
        claim: {field: process.stderr_status, in: [diagnostic]}
      - id: cli-information-written-to-stdout
        applies_to:
          - cli-information-request
        claim: {field: process.stdout_status, in: [information]}
