version: 1
name: contract-verifications
subject_ref: subject.logical-module-boundary.validation
verifications:
  - id: verification.logical-module-boundary.dependency-graph
    contract_id: contract.logical-module-boundary.dependency-graph
    cases:
      - id: typed-dependencies-and-declarations
        intent_id: graph-observation
        input:
          analysis_request:
            package: a3-rust-cruiser
            target: bin:a3-rust-cruiser
            features: []
            cfg: []
            target_triple: x86_64-unknown-linux-gnu
            analysis_profile: compilation
            include:
              - crate
            exclude: []
        checks:
          - id: check-analysis-context
            guarantee_ref: analysis-context-present
          - id: check-analysis-profile
            guarantee_ref: analysis-profile-supported
          - id: check-logical-modules
            guarantee_ref: logical-modules-present
          - id: check-module-declarations
            guarantee_ref: module-declarations-separated
          - id: check-dependency-edges
            guarantee_ref: dependency-edges-present
          - id: check-dependency-kind
            guarantee_ref: dependency-kind-supported
          - id: check-dependency-target-scope
            guarantee_ref: dependency-target-scope-supported
          - id: check-excluded-scopes
            guarantee_ref: excluded-scopes-present
      - id: source-union-source-authored-dependencies
        intent_id: source-union-observation
        input:
          analysis_request:
            source_union: true
            analysis_profile: source-union
            cfg_branches: union
            same_module_cfg_variants: union
            same_alias_cfg_variants: candidate-union
            conditional_runtime_dependencies: union
            development_dependencies: dev-target-only
            build_dependencies: out-of-scope
            macro_generated_dependencies: out-of-scope
            attribute_generated_dependencies: out-of-scope
        checks:
          - id: check-analysis-context
            guarantee_ref: analysis-context-present
          - id: check-analysis-profile
            guarantee_ref: analysis-profile-supported
          - id: check-source-union-profile
            guarantee_ref: source-union-profile-selected
          - id: check-dependency-edges
            guarantee_ref: dependency-edges-present
      - id: exact-runtime-item-macro-generated-dependencies
        intent_id: graph-observation
        input:
          analysis_request:
            analysis_profile: compilation
            exact_item_macro_definition: true
            unique_macro_namespace_resolution: true
            generated_items_and_paths: observed
        checks:
          - id: check-analysis-context
            guarantee_ref: analysis-context-present
          - id: check-analysis-profile
            guarantee_ref: analysis-profile-supported
          - id: check-dependency-edges
            guarantee_ref: dependency-edges-present
          - id: check-dependency-kind
            guarantee_ref: dependency-kind-supported
          - id: check-dependency-target-scope
            guarantee_ref: dependency-target-scope-supported
      - id: serde-function-path-generated-dependencies
        intent_id: graph-observation
        input:
          analysis_request:
            analysis_profile: compilation
            known_serde_function_path_attribute: true
            generated_path_dependency: observed
        checks:
          - id: check-analysis-context
            guarantee_ref: analysis-context-present
          - id: check-analysis-profile
            guarantee_ref: analysis-profile-supported
          - id: check-dependency-edges
            guarantee_ref: dependency-edges-present
          - id: check-dependency-kind
            guarantee_ref: dependency-kind-supported
          - id: check-dependency-target-scope
            guarantee_ref: dependency-target-scope-supported

  - id: verification.logical-module-boundary.boundary-policy-input
    contract_id: contract.logical-module-boundary.boundary-policy-input
    cases:
      - id: documented-policy-shape-is-accepted
        intent_id: boundary-policy-input-acceptance
        input:
          valid_boundary_policy:
            rules:
              - id: forbid-application-to-infrastructure
                kind: forbidden
                severity: error
                from:
                  - crate::application
                to:
                  - crate::infrastructure
                modules: []
                dependency_kinds:
                  - import
        checks:
          - id: check-valid-policy-accepted
            guarantee_ref: valid-boundary-policy-input-accepted
      - id: omitted-optional-policy-collections-default-empty
        intent_id: boundary-policy-input-acceptance
        input:
          valid_boundary_policy:
            rules:
              - id: forbid-application-to-infrastructure
                kind: forbidden
                severity: error
                from:
                  - crate::application
                to:
                  - crate::infrastructure
        checks:
          - id: check-valid-policy-accepted
            guarantee_ref: valid-boundary-policy-input-accepted
      - id: unknown-policy-field-is-rejected
        intent_id: boundary-policy-input-rejection
        input:
          invalid_boundary_policy:
            unknown_field: true
        checks:
          - id: check-invalid-policy-exit-code
            guarantee_ref: invalid-boundary-policy-input-exits-with-three
          - id: check-invalid-policy-stdout
            guarantee_ref: invalid-boundary-policy-input-keeps-stdout-empty
          - id: check-invalid-policy-stderr
            guarantee_ref: invalid-boundary-policy-input-writes-stderr-diagnostic
      - id: unsupported-policy-enum-is-rejected
        intent_id: boundary-policy-input-rejection
        input:
          invalid_boundary_policy:
            rule_kind: required
        checks:
          - id: check-invalid-policy-exit-code
            guarantee_ref: invalid-boundary-policy-input-exits-with-three
          - id: check-invalid-policy-stdout
            guarantee_ref: invalid-boundary-policy-input-keeps-stdout-empty
          - id: check-invalid-policy-stderr
            guarantee_ref: invalid-boundary-policy-input-writes-stderr-diagnostic
      - id: invalid-policy-rules-are-rejected
        intent_id: boundary-policy-input-rejection
        input:
          invalid_boundary_policy:
            constraints:
              - kebab-case-rule-id
              - unique-rule-id
              - forbidden-and-allowed-require-from-and-to
              - forbidden-and-allowed-forbid-modules
              - circular-requires-modules
              - circular-forbids-from-and-to
              - logical-module-pattern-grammar
        checks:
          - id: check-invalid-policy-exit-code
            guarantee_ref: invalid-boundary-policy-input-exits-with-three
          - id: check-invalid-policy-stdout
            guarantee_ref: invalid-boundary-policy-input-keeps-stdout-empty
          - id: check-invalid-policy-stderr
            guarantee_ref: invalid-boundary-policy-input-writes-stderr-diagnostic
      - id: yaml-and-sdd-boundary-inputs-are-rejected
        intent_id: boundary-policy-input-rejection
        input:
          invalid_boundary_policy:
            simultaneous_yaml_and_sdd: true
        checks:
          - id: check-invalid-policy-exit-code
            guarantee_ref: invalid-boundary-policy-input-exits-with-three
          - id: check-invalid-policy-stdout
            guarantee_ref: invalid-boundary-policy-input-keeps-stdout-empty
          - id: check-invalid-policy-stderr
            guarantee_ref: invalid-boundary-policy-input-writes-stderr-diagnostic
      - id: sdd-design-is-projected-to-boundary-policy
        intent_id: sdd-boundary-policy-input-acceptance
        input:
          valid_sdd_boundary_policy:
            sources:
              - logical-structure
              - projection
              - directory-structure
        checks:
          - id: check-valid-sdd-policy-accepted
            guarantee_ref: valid-sdd-boundary-policy-input-accepted
      - id: many-to-one-sdd-projection-is-accepted
        intent_id: sdd-boundary-policy-input-acceptance
        input:
          valid_sdd_boundary_policy:
            projection_shape: many-to-one
        checks:
          - id: check-valid-many-to-one-sdd-policy-accepted
            guarantee_ref: valid-sdd-boundary-policy-input-accepted
      - id: one-to-many-sdd-projection-is-accepted
        intent_id: one-to-many-sdd-projection-semantics
        input:
          valid_sdd_boundary_policy:
            projection_shape: one-to-many
          one_to_many_projected_scope_dependency:
            origin: secondary-projected-rust-module
            declared: false
        checks:
          - id: check-valid-one-to-many-sdd-policy-accepted
            guarantee_ref: valid-sdd-boundary-policy-input-accepted
          - id: check-one-to-many-projected-scope-enforced
            guarantee_ref: one-to-many-projected-scope-is-enforced
      - id: same-component-overlapping-projections-are-not-ambiguous
        intent_id: one-to-many-sdd-projection-semantics
        input:
          valid_sdd_boundary_policy:
            projection_shape: one-to-many-overlapping-parent-child
          same_component_overlapping_projections: true
        checks:
          - id: check-same-component-overlap-is-not-ambiguous
            guarantee_ref: same-component-overlap-is-not-ambiguous
          - id: check-same-component-overlap-does-not-duplicate-violations
            guarantee_ref: same-component-overlap-does-not-duplicate-violations
      - id: non-rust-sdd-projection-is-excluded
        intent_id: sdd-boundary-policy-input-acceptance
        input:
          valid_sdd_boundary_policy:
            projection_contains_source_outside_rust_module_scope: true
        checks:
          - id: check-valid-sdd-policy-with-non-rust-node-accepted
            guarantee_ref: valid-sdd-boundary-policy-input-accepted
      - id: overlapping-rust-module-projections-are-accepted
        intent_id: sdd-boundary-policy-input-acceptance
        input:
          valid_sdd_boundary_policy:
            rust_module_projection_shape: overlapping-parent-child
        checks:
          - id: check-overlapping-rust-module-projection-accepted
            guarantee_ref: valid-sdd-boundary-policy-input-accepted
      - id: incomplete-sdd-design-input-is-rejected
        intent_id: sdd-boundary-policy-input-rejection
        input:
          invalid_sdd_boundary_policy:
            missing_source: directory-structure
        checks:
          - id: check-invalid-sdd-policy-exit-code
            guarantee_ref: invalid-sdd-boundary-policy-input-exits-with-three
      - id: circular-sdd-component-dependencies-are-rejected
        intent_id: sdd-boundary-policy-input-rejection
        input:
          invalid_sdd_boundary_policy:
            logical_dependency_graph: circular
        checks:
          - id: check-circular-sdd-policy-exit-code
            guarantee_ref: invalid-sdd-boundary-policy-input-exits-with-three
      - id: inconsistent-sdd-design-inputs-are-rejected
        intent_id: sdd-boundary-policy-input-rejection
        input:
          invalid_sdd_boundary_policy:
            constraints:
              - unique-component-and-node-identities
              - complete-component-projection
              - known-component-and-node-references
              - distinct-directory-node-rust-modules
              - selected-cargo-target-root-projection-forbidden
              - normalized-project-relative-path
              - supported-rust-module-path
        checks:
          - id: check-inconsistent-sdd-policy-exit-code
            guarantee_ref: invalid-sdd-boundary-policy-input-exits-with-three

  - id: verification.logical-module-boundary.policy-evaluation
    contract_id: contract.logical-module-boundary.policy-evaluation
    cases:
      - id: forbidden-overrides-matching-allowed-rule
        intent_id: forbidden-precedence
        input:
          forbidden_and_allowed_match: true
          graph_and_boundary_policy:
            dependencies:
              - source: crate::application
                target: crate::infrastructure
                kind: import
            boundary_policy:
              rules:
                - id: forbidden-application-to-infrastructure
                  kind: forbidden
                  severity: error
                  from:
                    - crate::application
                  to:
                    - crate::infrastructure
                - id: allowed-application-targets
                  kind: allowed
                  severity: warning
                  from:
                    - crate::application
                  to:
                    - crate::infrastructure
        checks:
          - id: check-policy-violations
            guarantee_ref: violations-present
          - id: check-policy-violation-kind
            guarantee_ref: violation-kind-supported
          - id: check-policy-rule-id
            guarantee_ref: violation-rule-id-present
          - id: check-policy-severity
            guarantee_ref: violation-severity-supported
          - id: check-policy-source
            guarantee_ref: violation-source-present
          - id: check-policy-target
            guarantee_ref: violation-target-present
          - id: check-policy-dependency-kind
            guarantee_ref: violation-dependency-kind-present
          - id: check-policy-source-evidence
            guarantee_ref: violation-source-evidence-present
          - id: check-policy-source-line
            guarantee_ref: violation-source-line-present
          - id: check-policy-source-column
            guarantee_ref: violation-source-column-present
          - id: check-all-forbidden-matches
            guarantee_ref: all-forbidden-matches-evaluated
          - id: check-forbidden-precedence
            guarantee_ref: forbidden-overrides-allowed
      - id: applicable-allowed-rules-use-target-union
        intent_id: allowed-union-acceptance
        input:
          allowed_union_matches: true
          graph_and_boundary_policy:
            dependencies:
              - source: crate::application
                target: crate::domain
                kind: path-reference
            boundary_policy:
              rules:
                - id: allowed-application-shared
                  kind: allowed
                  severity: warning
                  from:
                    - crate::application
                  to:
                    - crate::shared
                - id: allowed-application-domain
                  kind: allowed
                  severity: warning
                  from:
                    - crate::application
                  to:
                    - crate::domain
        checks:
          - id: check-policy-violations
            guarantee_ref: violations-present
          - id: check-allowed-target-union
            guarantee_ref: allowed-targets-unioned
          - id: check-allowed-union-acceptance
            guarantee_ref: allowed-union-allows-dependency
      - id: unmatched-applicable-allowed-rules-produce-violation
        intent_id: allowed-union-rejection
        input:
          allowed_union_misses: true
          graph_and_boundary_policy:
            dependencies:
              - source: crate::application
                target: crate::infrastructure
                kind: import
            boundary_policy:
              rules:
                - id: allowed-application-domain
                  kind: allowed
                  severity: error
                  from:
                    - crate::application
                  to:
                    - crate::domain
        checks:
          - id: check-policy-violations
            guarantee_ref: violations-present
          - id: check-policy-violation-kind
            guarantee_ref: violation-kind-supported
          - id: check-policy-rule-id
            guarantee_ref: violation-rule-id-present
          - id: check-policy-severity
            guarantee_ref: violation-severity-supported
          - id: check-policy-source
            guarantee_ref: violation-source-present
          - id: check-policy-target
            guarantee_ref: violation-target-present
          - id: check-policy-dependency-kind
            guarantee_ref: violation-dependency-kind-present
          - id: check-policy-source-evidence
            guarantee_ref: violation-source-evidence-present
          - id: check-policy-source-line
            guarantee_ref: violation-source-line-present
          - id: check-policy-source-column
            guarantee_ref: violation-source-column-present
          - id: check-allowed-target-union
            guarantee_ref: allowed-targets-unioned
          - id: check-allowed-union-rejection
            guarantee_ref: allowed-union-rejects-dependency
      - id: circular-rule-is-independent-from-allowed-rules
        intent_id: circular-independent-evaluation
        input:
          allowed_cycle_present: true
          graph_and_boundary_policy:
            dependencies:
              - source: crate::application
                target: crate::domain
                kind: import
              - source: crate::domain
                target: crate::application
                kind: re-export
            boundary_policy:
              rules:
                - id: allowed-application-domain
                  kind: allowed
                  severity: warning
                  from:
                    - crate::application
                  to:
                    - crate::domain
                - id: allowed-domain-application
                  kind: allowed
                  severity: warning
                  from:
                    - crate::domain
                  to:
                    - crate::application
                - id: circular-core-modules
                  kind: circular
                  severity: error
                  modules:
                    - crate::application
                    - crate::domain
        checks:
          - id: check-policy-violations
            guarantee_ref: violations-present
          - id: check-policy-violation-kind
            guarantee_ref: violation-kind-supported
          - id: check-policy-rule-id
            guarantee_ref: violation-rule-id-present
          - id: check-policy-severity
            guarantee_ref: violation-severity-supported
          - id: check-policy-source
            guarantee_ref: violation-source-present
          - id: check-policy-target
            guarantee_ref: violation-target-present
          - id: check-policy-dependency-kind
            guarantee_ref: violation-dependency-kind-present
          - id: check-policy-source-evidence
            guarantee_ref: violation-source-evidence-present
          - id: check-policy-source-line
            guarantee_ref: violation-source-line-present
          - id: check-policy-source-column
            guarantee_ref: violation-source-column-present
          - id: check-cycle-independent
            guarantee_ref: cycle-evaluated-independently
          - id: check-cycle-dependencies-allowed
            guarantee_ref: allowed-cycle-dependencies-remain-allowed
          - id: check-cycle-not-suppressed
            guarantee_ref: allowed-rules-do-not-suppress-cycle
          - id: check-cycle-path
            guarantee_ref: circular-violation-cycle-path-present

  - id: verification.logical-module-boundary.validation-report
    contract_id: contract.logical-module-boundary.validation-report
    cases:
      - id: complete-without-violation
        intent_id: decision-precedence
        input:
          complete_without_violation: true
        checks:
          - id: check-conformant-decision
            guarantee_ref: conformant-decision
      - id: complete-with-violation
        intent_id: decision-precedence
        input:
          complete_with_violation: true
        checks:
          - id: check-non-conformant-decision
            guarantee_ref: non-conformant-decision
      - id: incomplete-with-observed-violation
        intent_id: decision-precedence
        input:
          complete_with_violation: true
          analysis_issue_policy_impact_possible: true
          observed_violation: true
        checks:
          - id: check-non-conformant-decision
            guarantee_ref: non-conformant-decision
      - id: possible-policy-impact-without-violation-is-indeterminate
        intent_id: decision-precedence
        input:
          complete_without_violation: true
          analysis_issue_policy_impact_possible: true
          report_request: true
        checks:
          - id: check-indeterminate-decision
            guarantee_ref: indeterminate-decision
      - id: unresolved-candidate-without-policy-impact
        intent_id: analysis-issue-classification
        input:
          complete_without_violation: true
          unresolved_dependency_analysis_issue: true
          analysis_issue_policy_impact_none: true
          report_request: true
        checks:
          - id: check-conformant-decision
            guarantee_ref: conformant-decision
          - id: check-analysis-observation-outcome
            guarantee_ref: analysis-observation-outcome-supported
          - id: check-analysis-policy-impact-outcome
            guarantee_ref: analysis-policy-impact-outcome-supported
          - id: check-unresolved-observation
            guarantee_ref: unresolved-dependency-observation
          - id: check-no-policy-impact
            guarantee_ref: analysis-issue-has-no-policy-impact
      - id: unresolved-candidate-allowed-union-matches
        intent_id: analysis-issue-classification
        input:
          complete_without_violation: true
          unresolved_dependency_analysis_issue: true
          unresolved_candidate_allowed_union_matches: true
          analysis_issue_policy_impact_none: true
          unresolved_candidate_policy_shape:
            candidate_targets:
              - crate::left
              - crate::right
            allowed_target_union:
              - crate::left
              - crate::right
            applicable_allowed_rule_ids:
              - allowed-left
              - allowed-right
            dependency_kinds:
              - path-reference
          report_request: true
        checks:
          - id: check-conformant-decision
            guarantee_ref: conformant-decision
          - id: check-unresolved-observation
            guarantee_ref: unresolved-dependency-observation
          - id: check-allowed-union-match-no-impact
            guarantee_ref: unresolved-candidate-allowed-union-match-has-no-policy-impact
      - id: unresolved-candidate-allowed-union-misses
        intent_id: analysis-issue-classification
        input:
          complete_without_violation: true
          unresolved_dependency_analysis_issue: true
          unresolved_candidate_allowed_union_misses: true
          analysis_issue_policy_impact_possible: true
          unresolved_candidate_policy_shape:
            candidate_targets:
              - crate::left
              - crate::right
            allowed_target_union:
              - crate::left
              - crate::domain
            applicable_allowed_rule_ids:
              - allowed-domain
              - allowed-left
            dependency_kinds:
              - path-reference
          report_request: true
        checks:
          - id: check-indeterminate-decision
            guarantee_ref: indeterminate-decision
          - id: check-unresolved-observation
            guarantee_ref: unresolved-dependency-observation
          - id: check-allowed-union-miss-possible
            guarantee_ref: unresolved-candidate-allowed-union-miss-has-possible-policy-impact
          - id: check-possible-policy-rule-ids
            guarantee_ref: possible-policy-impact-rule-ids-present
      - id: unresolved-candidate-with-empty-targets
        intent_id: analysis-issue-classification
        input:
          complete_without_violation: true
          unresolved_dependency_analysis_issue: true
          unresolved_candidate_targets_empty: true
          analysis_issue_policy_impact_possible: true
          unresolved_candidate_policy_shape:
            candidate_targets: []
            allowed_target_union:
              - crate::domain
            applicable_allowed_rule_ids:
              - allowed-domain
          report_request: true
        checks:
          - id: check-indeterminate-decision
            guarantee_ref: indeterminate-decision
          - id: check-unresolved-observation
            guarantee_ref: unresolved-dependency-observation
          - id: check-empty-targets-possible
            guarantee_ref: unresolved-candidate-with-empty-targets-has-possible-policy-impact
          - id: check-possible-policy-rule-ids
            guarantee_ref: possible-policy-impact-rule-ids-present
      - id: dependency-neutral-without-policy-impact
        intent_id: analysis-issue-classification
        input:
          complete_without_violation: true
          dependency_neutral_analysis_issue: true
          analysis_issue_policy_impact_none: true
          report_request: true
        checks:
          - id: check-conformant-decision
            guarantee_ref: conformant-decision
          - id: check-neutral-policy-impact
            guarantee_ref: dependency-neutral-has-no-policy-impact
      - id: ambiguous-component-attribution-is-non-conformant
        intent_id: ambiguous-component-attribution-report
        input:
          analysis_issue_policy_impact_possible:
            code: analysis.ambiguous-component-attribution
            affected_scope: crate::shared
          ambiguous_component_attribution: true
          complete_with_violation: true
          report_request: true
          observed_violation: true
        checks:
          - id: check-non-conformant
            guarantee_ref: non-conformant-decision
          - id: check-analysis-issues
            guarantee_ref: analysis-issues-present
          - id: check-analysis-issue-code
            guarantee_ref: ambiguous-component-attribution-code
          - id: check-analysis-issue-reason
            guarantee_ref: analysis-issue-reason-present
          - id: check-analysis-issue-affected-scope
            guarantee_ref: analysis-issue-affected-scope-present
          - id: check-analysis-observation-outcome
            guarantee_ref: analysis-observation-outcome-supported
          - id: check-analysis-policy-impact-outcome
            guarantee_ref: analysis-policy-impact-outcome-supported
          - id: check-canonical-ordering
            guarantee_ref: report-ordering-canonical
          - id: check-safe-violations-remain-observable
            guarantee_ref: report-violations-present
      - id: invariant-allowed-component-assignments-are-conformant
        intent_id: ambiguous-component-attribution-report
        input:
          complete_without_violation: true
          ambiguous_component_attribution: true
          analysis_issue_policy_impact_none: true
          component_assignment_outcome: invariant-allowed
          report_request: true
        checks:
          - id: check-conformant-decision
            guarantee_ref: conformant-decision
          - id: check-analysis-issue-code
            guarantee_ref: ambiguous-component-attribution-code
          - id: check-analysis-observation-outcome
            guarantee_ref: analysis-observation-outcome-supported
          - id: check-analysis-policy-impact-outcome
            guarantee_ref: analysis-policy-impact-outcome-supported
          - id: check-no-policy-impact
            guarantee_ref: analysis-issue-has-no-policy-impact
      - id: invariant-forbidden-component-assignments-are-non-conformant
        intent_id: ambiguous-component-attribution-report
        input:
          complete_with_violation: true
          ambiguous_component_attribution: true
          analysis_issue_policy_impact_none: true
          component_assignment_outcome: invariant-forbidden
          report_request: true
        checks:
          - id: check-non-conformant-decision
            guarantee_ref: non-conformant-decision
          - id: check-analysis-issue-code
            guarantee_ref: ambiguous-component-attribution-code
          - id: check-safe-violations-remain-observable
            guarantee_ref: report-violations-present
      - id: assignment-dependent-component-outcomes-are-indeterminate
        intent_id: ambiguous-component-attribution-report
        input:
          ambiguous_component_attribution: true
          analysis_issue_policy_impact_possible: true
