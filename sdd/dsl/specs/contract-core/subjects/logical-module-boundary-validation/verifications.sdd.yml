version: 1
name: contract-verifications
cases:
  - contract_id: contract.logical-module-boundary.dependency-graph
    id: typed-dependencies-and-declarations
    partition: compilation-profile-request
    input:
      analysis_context:
        package: a3-rust-cruiser
        target: bin:a3-rust-cruiser
        features: []
        cfg: []
        target_triple: x86_64-unknown-linux-gnu
        analysis_profile: compilation
        include:
          - crate
        exclude: []
  - contract_id: contract.logical-module-boundary.dependency-graph
    id: source-union-source-authored-dependencies
    partition: source-union-request-present
    input:
      analysis_context:
        analysis_profile: source-union
      rust_project:
        source_constructs:
          - cfg-branches
          - same-module-cfg-variants
          - same-alias-cfg-variants
          - conditional-runtime-dependencies
          - development-dependencies
          - build-dependencies
          - macro-generated-dependencies
          - attribute-generated-dependencies
  - contract_id: contract.logical-module-boundary.dependency-graph
    id: exact-runtime-item-macro-generated-dependencies
    partition: compilation-profile-request
    input:
      analysis_context:
        analysis_profile: compilation
      rust_project:
        source_constructs:
          - exact-local-item-macro-definition
          - unique-macro-namespace-resolution
          - item-macro-generated-paths
    verifies:
      - analysis-context-present
      - analysis-profile-supported
      - dependency-edges-present
      - dependency-kind-supported
      - dependency-target-scope-supported
  - contract_id: contract.logical-module-boundary.dependency-graph
    id: serde-function-path-generated-dependencies
    partition: compilation-profile-request
    input:
      analysis_context:
        analysis_profile: compilation
      rust_project:
        source_constructs:
          - known-serde-function-path-attribute
    verifies:
      - analysis-context-present
      - analysis-profile-supported
      - dependency-edges-present
      - dependency-kind-supported
      - dependency-target-scope-supported
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: documented-policy-shape-is-accepted
    partition: valid-boundary-policy-input
    input:
      boundary_policy:
        rules:
          - id: forbid-application-to-infrastructure
            kind: forbidden
            severity: error
            from:
              - crate::application
            to:
              - crate::infrastructure
            modules: []
            dependency_kinds:
              - import
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: omitted-optional-policy-collections-default-empty
    partition: valid-boundary-policy-input
    input:
      boundary_policy:
        rules:
          - id: forbid-application-to-infrastructure
            kind: forbidden
            severity: error
            from:
              - crate::application
            to:
              - crate::infrastructure
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: unknown-policy-field-is-rejected
    partition: invalid-boundary-policy-input
    input:
      boundary_policy:
        defects:
          - unknown-field
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: unsupported-policy-enum-is-rejected
    partition: invalid-boundary-policy-input
    input:
      boundary_policy:
        rule_kind: required
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: invalid-policy-rules-are-rejected
    partition: invalid-boundary-policy-input
    input:
      boundary_policy:
        violated_constraints:
          - kebab-case-rule-id
          - unique-rule-id
          - forbidden-and-allowed-require-from-and-to
          - forbidden-and-allowed-forbid-modules
          - circular-requires-modules
          - circular-forbids-from-and-to
          - logical-module-pattern-grammar
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: resolved-implementation-attribution-is-consumed-directly
    partition: valid-resolved-implementation-attribution-input
    input:
      resolved_implementation_attribution:
        version: 1
        provenance_present: true
        file_attribution_covers_selected_modules: true
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: invalid-resolved-implementation-attribution-is-rejected
    partition: invalid-resolved-implementation-attribution-input
    input:
      resolved_implementation_attribution:
        defects:
          - malformed
          - unknown-version
          - unknown-name
          - invalid-provenance
          - legacy-consumer-envelope-field
          - missing-required-dependency-collection
      rust_project:
        cargo_manifest: invalid
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: resolved-attribution-and-other-policy-sources-are-rejected
    partition: invalid-resolved-implementation-attribution-input
    input:
      policy_source_options:
        - --policy
        - --resolved-implementation-attribution
    verifies:
      - invalid-policy-source-exits-with-three
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: unresolved-implementation-attribution-is-indeterminate
    partition: unresolved-implementation-attribution
    input:
      resolved_implementation_attribution:
        defects:
          - missing-observed-file-attribution
  - contract_id: contract.logical-module-boundary.boundary-policy-input
    id: resolved-attribution-forbidden-edge-is-non-conformant
    partition: forbidden-resolved-attribution-edge
    input:
      resolved_implementation_attribution:
        source_and_target_scopes: different
        scope_dependency_for_observed_edge: absent
      rust_project:
        observed_dependency: cross-scope
  - contract_id: contract.logical-module-boundary.policy-evaluation
    id: forbidden-overrides-matching-allowed-rule
    partition: forbidden-and-allowed-match
    input:
      rust_project:
        dependencies:
          - source: crate::application
            target: crate::infrastructure
            kind: import
      boundary_policy:
        rules:
          - id: forbidden-application-to-infrastructure
            kind: forbidden
            severity: error
            from:
              - crate::application
            to:
              - crate::infrastructure
          - id: allowed-application-targets
            kind: allowed
            severity: warning
            from:
              - crate::application
            to:
              - crate::infrastructure
  - contract_id: contract.logical-module-boundary.policy-evaluation
    id: applicable-allowed-rules-use-target-union
    partition: allowed-union-matches
    input:
      rust_project:
        dependencies:
          - source: crate::application
            target: crate::domain
            kind: path-reference
      boundary_policy:
        rules:
          - id: allowed-application-shared
            kind: allowed
            severity: warning
            from:
              - crate::application
            to:
              - crate::shared
          - id: allowed-application-domain
            kind: allowed
            severity: warning
            from:
              - crate::application
            to:
              - crate::domain
  - contract_id: contract.logical-module-boundary.policy-evaluation
    id: unmatched-applicable-allowed-rules-produce-violation
    partition: allowed-union-misses
    input:
      rust_project:
        dependencies:
          - source: crate::application
            target: crate::infrastructure
            kind: import
      boundary_policy:
        rules:
          - id: allowed-application-domain
            kind: allowed
            severity: error
            from:
              - crate::application
            to:
              - crate::domain
  - contract_id: contract.logical-module-boundary.policy-evaluation
    id: circular-rule-is-independent-from-allowed-rules
    partition: allowed-cycle-present
    input:
      rust_project:
        dependencies:
          - source: crate::application
            target: crate::domain
            kind: import
          - source: crate::domain
            target: crate::application
            kind: re-export
      boundary_policy:
        rules:
          - id: allowed-application-domain
            kind: allowed
            severity: warning
            from:
              - crate::application
            to:
              - crate::domain
          - id: allowed-domain-application
            kind: allowed
            severity: warning
            from:
              - crate::domain
            to:
              - crate::application
          - id: circular-core-modules
            kind: circular
            severity: error
            modules:
              - crate::application
              - crate::domain
  - contract_id: contract.logical-module-boundary.validation-report
    id: complete-without-violation
    partition: complete-without-violation
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: absent
  - contract_id: contract.logical-module-boundary.validation-report
    id: complete-with-violation
    partition: complete-with-violation
    input:
      project_and_policy:
        violating_dependency: present
        unanalyzable_construct: absent
  - contract_id: contract.logical-module-boundary.validation-report
    id: incomplete-with-observed-violation
    partition: observed-violation-with-possible-policy-impact
    input:
      project_and_policy:
        violating_dependency: present
        unanalyzable_construct: present
        construct_affects_applicable_rule: true
  - contract_id: contract.logical-module-boundary.validation-report
    id: possible-policy-impact-without-violation-is-indeterminate
    partition: possible-policy-impact-without-violation
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: present
        construct_affects_applicable_rule: true
  - contract_id: contract.logical-module-boundary.validation-report
    id: unresolved-candidate-without-policy-impact
    partition: unresolved-dependency-without-policy-impact
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: unresolved-dependency
        construct_affects_applicable_rule: false
  - contract_id: contract.logical-module-boundary.validation-report
    id: unresolved-candidate-allowed-union-matches
    partition: unresolved-candidate-allowed-union-matches
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: unresolved-dependency
        unresolved_candidate_targets:
          - crate::left
          - crate::right
        allowed_target_union:
          - crate::left
          - crate::right
        applicable_allowed_rule_ids:
          - allowed-left
          - allowed-right
        dependency_kinds:
          - path-reference
  - contract_id: contract.logical-module-boundary.validation-report
    id: unresolved-candidate-allowed-union-misses
    partition: unresolved-candidate-allowed-union-misses
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: unresolved-dependency
        unresolved_candidate_targets:
          - crate::left
          - crate::right
        allowed_target_union:
          - crate::left
          - crate::domain
        applicable_allowed_rule_ids:
          - allowed-domain
          - allowed-left
        dependency_kinds:
          - path-reference
  - contract_id: contract.logical-module-boundary.validation-report
    id: unresolved-candidate-with-empty-targets
    partition: unresolved-candidate-targets-empty
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: unresolved-dependency
        unresolved_candidate_targets: []
        allowed_target_union:
          - crate::domain
        applicable_allowed_rule_ids:
          - allowed-domain
  - contract_id: contract.logical-module-boundary.validation-report
    id: dependency-neutral-without-policy-impact
    partition: dependency-neutral-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: dependency-neutral
        construct_affects_applicable_rule: false
  - contract_id: contract.logical-module-boundary.validation-report
    id: known-compilation-context-is-resolved
    partition: resolved-analysis-context
    input:
      project_and_policy:
        violating_dependency: absent
        resolved_constructs:
          - rustc-target-cfg
          - cargo-optional-dependency-feature
          - inactive-cfg-item
          - lexical-use-and-local-binding
          - dependency-neutral-standard-macro-and-derive
          - dependency-neutral-external-macro-with-proven-identity
          - exact-safe-local-macro
          - known-serde-function-path-attribute
  - contract_id: contract.logical-module-boundary.validation-report
    id: inactive-cfg-attr-path-module-is-ignored
    partition: resolved-analysis-context
    input:
      project_and_policy:
        violating_dependency: absent
        resolved_constructs:
          - inactive-cfg-attr-path-module
  - contract_id: contract.logical-module-boundary.validation-report
    id: path-module-unsupported-syntax-is-indeterminate
    partition: path-module-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: path-module-unsupported-syntax
      report_options:
        format: json
  - contract_id: contract.logical-module-boundary.validation-report
    id: json-report
    partition: legacy-json-report-request
    input:
      policy_source: boundary-policy
      report_options:
        format: json
  - contract_id: contract.logical-module-boundary.validation-report
    id: resolved-attribution-json-report
    partition: resolved-implementation-attribution-json-report-request
    input:
      policy_source: resolved-implementation-attribution
      report_options:
        format: json
  - contract_id: contract.logical-module-boundary.validation-report
    id: text-report
    partition: text-report-request
    input:
      report_options:
        format: text
  - contract_id: contract.logical-module-boundary.validation-report
    id: repeated-json-report
    partition: legacy-json-report-request
    input:
      policy_source: boundary-policy
      report_options:
        format: json
        repeat_count: 2
    verifies:
      - json-schema-version-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.validation-report
    id: unresolved-reference-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unresolved-reference
      report_options:
        format: json
  - contract_id: contract.logical-module-boundary.validation-report
    id: source-union-unresolved-reference-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      analysis_context:
        analysis_profile: source-union
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unresolved-reference
      report_options:
        format: json
    verifies:
      - indeterminate-decision
      - possible-policy-impact-rule-ids-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - analysis-observation-outcome-supported
      - analysis-policy-impact-outcome-supported
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.validation-report
    id: unsupported-macro-expansion-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unsupported-macro-expansion
      report_options:
        format: json
    verifies:
      - indeterminate-decision
      - possible-policy-impact-rule-ids-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - analysis-observation-outcome-supported
      - analysis-policy-impact-outcome-supported
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.validation-report
    id: unsupported-name-resolution-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unsupported-name-resolution
      report_options:
        format: json
    verifies:
      - indeterminate-decision
      - possible-policy-impact-rule-ids-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - analysis-observation-outcome-supported
      - analysis-policy-impact-outcome-supported
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.validation-report
    id: unsupported-syntax-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unsupported-syntax
      report_options:
        format: json
    verifies:
      - indeterminate-decision
      - possible-policy-impact-rule-ids-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - analysis-observation-outcome-supported
      - analysis-policy-impact-outcome-supported
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.validation-report
    id: unsupported-analysis-context-is-indeterminate
    partition: possible-policy-impact-analysis-issue
    input:
      project_and_policy:
        violating_dependency: absent
        construct_affects_applicable_rule: true
        unanalyzable_construct: unsupported-analysis-context
      report_options:
        format: json
    verifies:
      - indeterminate-decision
      - possible-policy-impact-rule-ids-present
      - analysis-issues-present
      - analysis-issue-code-supported
      - analysis-issue-reason-present
      - analysis-issue-affected-scope-present
      - analysis-observation-outcome-supported
      - analysis-policy-impact-outcome-supported
      - report-serialization-supported
      - report-ordering-canonical
      - report-decision-supported
      - report-violations-present
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: root-help
    partition: cli-information-request
    input:
      cli_arguments:
        kind: root-help
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: check-help
    partition: cli-information-request
    input:
      cli_arguments:
        kind: check-help
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: version
    partition: cli-information-request
    input:
      cli_arguments:
        kind: version
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: conformant-exit
    partition: conformant-result
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: absent
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: non-conformant-exit
    partition: non-conformant-result
    input:
      project_and_policy:
        violating_dependency: present
        unanalyzable_construct: absent
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: indeterminate-exit
    partition: indeterminate-result
    input:
      project_and_policy:
        violating_dependency: absent
        unanalyzable_construct: unsupported-macro-expansion
        construct_affects_applicable_rule: true
  - contract_id: contract.logical-module-boundary.cli-outcome
    id: execution-failure-exit
    partition: cli-execution-failure
    input:
      cli_arguments:
        kind: unknown-subcommand
