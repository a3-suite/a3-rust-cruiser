version: 1
name: contract-observations
subject_ref: subject.installer.product-setup
observations:
  - id: observation.installer.product-setup
    summary: repositoryに宣言されたinstaller設定と利用者向け導入案内
    boundary:
      ref: boundary.repository-source-configuration
    locator:
      surface: Cargo package version、installer assembly、platform manifests、README、setup guides
    value:
      root: installer
      kind: object
      fields:
        - selector: installer.product_setup.assembly
          kind: observation_field
          meaning: 製品versionと対応platform別payloadを結び付けるinstaller assembly
        - selector: installer.product_setup.package.release_version
          kind: observation_field
          meaning: Cargo packageに宣言された製品version
        - selector: installer.product_setup.assembly.release_version
          kind: observation_field
          meaning: installer assemblyが共有wrapperの配布URLに指定する製品version
        - selector: installer.product_setup.manifests
          kind: observation_field
          meaning: 対応platform別installer manifest群
        - selector: installer.product_setup.manifests.release_version
          kind: observation_field
          meaning: platform manifestsのrelease pathに指定された製品version
        - selector: installer.product_setup.readme.release_version
          kind: observation_field
          meaning: READMEのinstaller download URLに指定された製品version
        - selector: installer.product_setup.installation_guidance
          kind: observation_field
          meaning: repository root READMEとSkillのrepository setup entrypointにある導入案内
        - selector: installer.product_setup.retired_project_installer_assets
          kind: observation_field
          meaning: provider所有のinstaller runtimeを置き換えるproject-owned installer実装資産
