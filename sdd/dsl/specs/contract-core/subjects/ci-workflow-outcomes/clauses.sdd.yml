version: 1
name: contract-clauses
subject_ref: subject.ci.workflow-configuration
contracts:
  - id: contract.ci.quality-gate.binding
    summary: repositoryはpull requestとdefault branch pushに品質workflowを結び付ける。
    conditions:
      - id: quality-workflow-configured
        input_predicate:
          kind: input
          term: input.workflow_source
          op: present
    guarantees:
      - id: quality-workflow-provider-bound
        when: quality-workflow-configured
        observation_ref: observation.ci.workflow-configuration
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: ci.quality_gate.workflow_binding
    verification_intents:
      - id: quality-gate-provider-binding
        goal: quality workflowのtriggerと固定provider設定がrepository内で宣言される。
        guarantee_refs: [quality-workflow-provider-bound]
  - id: contract.ci.release-request.binding
    summary: repositoryはannotated release tagを固定providerへhandoffする設定を持つ。
    conditions:
      - id: release-tag-workflow-configured
        input_predicate:
          kind: input
          term: input.workflow_source
          op: present
    guarantees:
      - id: release-tag-provider-bound
        when: release-tag-workflow-configured
        observation_ref: observation.ci.workflow-configuration
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: ci.release_request.workflow_binding
    verification_intents:
      - id: release-request-provider-binding
        goal: tag trigger、annotated tag resolver、request handoffの固定provider設定がrepository内で宣言される。
        guarantee_refs: [release-tag-provider-bound]
  - id: contract.ci.release-publication.binding
    summary: repositoryは承認済みrequestを固定providerとproduct installer assemblyへ結び付ける。
    conditions:
      - id: release-publication-workflow-configured
        input_predicate:
          kind: input
          term: input.workflow_source
          op: present
    guarantees:
      - id: release-publication-provider-bound
        when: release-publication-workflow-configured
        observation_ref: observation.ci.workflow-configuration
        claim:
          kind: observable-result
          op: present
          target:
            kind: observation_field
            value: ci.release_publication.workflow_binding
    verification_intents:
      - id: release-publication-provider-binding
        goal: approval handoff、固定publication provider、platform manifest、installer assemblyの接続がrepository内で宣言される。
        guarantee_refs: [release-publication-provider-bound]
