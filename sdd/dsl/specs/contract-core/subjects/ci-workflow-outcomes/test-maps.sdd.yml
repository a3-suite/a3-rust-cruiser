version: 1
name: contract-test-maps
subject_ref: subject.ci.workflow-configuration
test_maps:
  - verification_id: verification.ci.quality-gate
    case_id: quality-workflow-provider-is-bound
    tests:
      - path: tests/ci/ci-workflow-contract-test.sh
        symbol: quality_gate_contract
        check_refs: [check-quality-gate-provider-binding]
  - verification_id: verification.ci.release-request
    case_id: release-tag-provider-is-bound
    tests:
      - path: tests/ci/ci-workflow-contract-test.sh
        symbol: release_request_contract
        check_refs: [check-release-tag-provider-binding]
  - verification_id: verification.ci.release-publication
    case_id: approved-publication-provider-is-bound
    tests:
      - path: tests/ci/ci-workflow-contract-test.sh
        symbol: release_publication_contract
        check_refs: [check-release-publication-provider-binding]
