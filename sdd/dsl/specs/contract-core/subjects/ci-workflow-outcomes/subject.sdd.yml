version: 1
name: contract-subject
subject:
  id: subject.ci.workflow-configuration
  summary: CI品質workflowとRelease publicationのrepository設定を整合させるcapability
contracts:
  - id: contract.ci.quality-gate.binding
    summary: repositoryはpull requestとdefault branch pushに品質workflowを結び付ける。
    inputs:
      - name: workflow_source
        meaning: 契約対象が読むrepository内のworkflow宣言ファイル
    observations:
      - boundary: boundary.repository-source-configuration
        summary: repositoryに宣言された品質workflow、tag request、Release publicationの設定
        surface: GitHub Actions workflow declarations、provider revision、platform manifest、installer assembly
        fields:
          - selector: ci.quality_gate.workflow_binding
            meaning: pull requestとdefault branch pushに対する品質workflowのprovider bindingと設定
    guarantees:
      - id: quality-workflow-provider-bound
        claim: {field: ci.quality_gate.workflow_binding, present: true}
  - id: contract.ci.release-request.binding
    summary: repositoryはannotated release tagを固定providerへhandoffする設定を持つ。
    inputs:
      - name: workflow_source
        meaning: 契約対象が読むrepository内のworkflow宣言ファイル
    observations:
      - boundary: boundary.repository-source-configuration
        summary: repositoryに宣言された品質workflow、tag request、Release publicationの設定
        surface: GitHub Actions workflow declarations、provider revision、platform manifest、installer assembly
        fields:
          - selector: ci.release_request.workflow_binding
            meaning: annotated tag identityをhandoffするtag workflowのtriggerとprovider action binding
    guarantees:
      - id: release-tag-provider-bound
        claim: {field: ci.release_request.workflow_binding, present: true}
  - id: contract.ci.release-publication.binding
    summary: repositoryは承認済みrequestを固定provider、product installer assembly、公開スキル宣言へ結び付ける。
    inputs:
      - name: workflow_source
        meaning: 契約対象が読むrepository内のworkflow宣言ファイル
    observations:
      - boundary: boundary.repository-source-configuration
        summary: repositoryに宣言された品質workflow、tag request、Release publicationの設定
        surface: GitHub Actions workflow declarations、provider revision、platform manifest、installer assembly
        fields:
          - selector: ci.release_publication.workflow_binding
            meaning: approved request、Release publication provider binding、product installer assembly、公開スキル宣言を結ぶworkflow設定
    guarantees:
      - id: release-publication-provider-bound
        claim: {field: ci.release_publication.workflow_binding, present: true}
