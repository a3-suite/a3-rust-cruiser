name: quality-gate
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' &&
    github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    uses: a3-suite/a3-ci-github/.github/workflows/ci-quality.yml@708fe45368ff54488a5fc260d7e9f6dd89b6de2a
    permissions:
      contents: read
    with:
      runner: ubuntu-24.04
      language-profile: rust
      toolchain-version: 1.98.0
      uv-version: ""
      cargo-audit-version: 0.22.1
      cargo-manifest-path: Cargo.toml
      cargo-lock-path: Cargo.lock
      cargo-deny-version: ""
      cargo-deny-config-path: ""
      jq-version: ""
      standard-bundle-id: rust-cargo-quality
      adapter-descriptor: ""
      docs-only-patterns: docs/**,README.md,**/*.md
  summary:
    needs: quality
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@1c7f2d610441d952004b6d96c7c8aad2d2242920
        with:
          summary-json: '{"jobs":[{"unit":"quality","execution":"fixed reusable quality
            workflow","rawResult":"${{ needs.quality.result
            }}","applicable":true,"reason":"reusable quality workflow result:
            ${{ needs.quality.result }}"}]}'
