name: publish-release

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions: {}

jobs:
  preflight:
    name: publish-release / preflight
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      expected_platforms: ${{ steps.verify.outputs.expected_platforms }}
      release_version: ${{ steps.verify.outputs.release_version }}
      source_policy_fingerprint: ${{ steps.verify.outputs.source_policy_fingerprint }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      tag_name: ${{ steps.verify.outputs.tag_name }}
      tag_ref: ${{ steps.verify.outputs.tag_ref }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Download release request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-request
          path: request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify release request
        id: verify
        env:
          EXPECTED_EVENT: ${{ github.event.workflow_run.event }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash control/.ci/scripts/validate-release-tag.sh request/release-request.json control

  build-linux:
    name: publish-release / linux x86_64
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.handoff.outputs.artifact-digest }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build and verify release asset
        env:
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_TAG_REF: ${{ needs.preflight.outputs.tag_ref }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: >-
          bash control/.ci/scripts/build-release-asset.sh source
          x86_64-unknown-linux-gnu "$RELEASE_TAG_REF"
          "$RELEASE_SOURCE_SHA" "$RELEASE_VERSION" handoff
      - name: Upload verified Linux handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: handoff
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  build-macos:
    name: publish-release / macOS arm64
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.handoff.outputs.artifact-digest }}
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build and verify release asset
        env:
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_TAG_REF: ${{ needs.preflight.outputs.tag_ref }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: >-
          bash control/.ci/scripts/build-release-asset.sh source
          aarch64-apple-darwin "$RELEASE_TAG_REF"
          "$RELEASE_SOURCE_SHA" "$RELEASE_VERSION" handoff
      - name: Upload verified macOS handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: handoff
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  release:
    name: publish-release / GitHub Release
    needs: [preflight, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-release-${{ needs.preflight.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Download Linux handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact_id }}
          path: handoffs/linux
          merge-multiple: true
      - name: Download macOS handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: handoffs/macos
          merge-multiple: true
      - name: Publish immutable GitHub Release
        env:
          EXPECTED_LINUX_ARTIFACT_DIGEST: ${{ needs.build-linux.outputs.artifact_digest }}
          EXPECTED_LINUX_ARTIFACT_ID: ${{ needs.build-linux.outputs.artifact_id }}
          EXPECTED_MACOS_ARTIFACT_DIGEST: ${{ needs.build-macos.outputs.artifact_digest }}
          EXPECTED_MACOS_ARTIFACT_ID: ${{ needs.build-macos.outputs.artifact_id }}
          EXPECTED_PLATFORMS: ${{ needs.preflight.outputs.expected_platforms }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          RELEASE_TAG_REF: ${{ needs.preflight.outputs.tag_ref }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
          SOURCE_POLICY_FINGERPRINT: ${{ needs.preflight.outputs.source_policy_fingerprint }}
        run: bash control/.ci/scripts/publish-github-release.sh control handoffs/linux handoffs/macos
