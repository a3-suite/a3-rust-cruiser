name: ci-trusted

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci-trusted
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - name: Checkout trusted CI assets from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          sparse-checkout: |
            .ci
            .github/workflows
            rust-toolchain.toml
          persist-credentials: false
      - name: Verify CI tool versions
        run: bash control/.ci/scripts/verify-ci-tools.sh ubuntu-24.04
      - name: Install Rust toolchain
        working-directory: control
        run: rustup toolchain install --no-self-update
      - name: Verify Rust toolchain
        working-directory: control
        run: bash .ci/scripts/verify-rust-toolchain.sh
      - name: Validate trusted CI scripts
        working-directory: control
        run: bash -n .ci/scripts/*.sh .ci/tests/*.sh
      - name: Run trusted CI contract tests
        working-directory: control
        run: bash .ci/tests/run-ci-contract-tests.sh
      - name: Check formatting
        working-directory: source
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: source
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        working-directory: source
        run: cargo test --locked --all-targets --all-features
