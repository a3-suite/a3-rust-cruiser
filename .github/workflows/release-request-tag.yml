name: release-request-tag
on:
  push:
    tags:
      - v*
permissions: {}
jobs:
  request:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CI_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve annotated tag identity
        id: tag
        uses: a3-suite/a3-ci-github/actions/ci-annotated-tag-resolver@1c7f2d610441d952004b6d96c7c8aad2d2242920
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          github-token: ${{ env.CI_GITHUB_TOKEN }}
      - name: Write tag request handoff
        uses: a3-suite/a3-ci-github/actions/ci-release-request-handoff@1c7f2d610441d952004b6d96c7c8aad2d2242920
        with:
          output-directory: release-request
          tag-source-sha: ${{ steps.tag.outputs.source-sha }}
          tag-object-sha: ${{ steps.tag.outputs.tag-object-sha }}
          github-ref: ${{ github.ref }}
          github-ref-name: ${{ github.ref_name }}
          request-run-id: ${{ github.run_id }}
          request-actor: ${{ github.actor }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-request
          path: release-request
          if-no-files-found: error
  summary:
    needs: request
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        uses: a3-suite/a3-ci-github/actions/ci-quality-summary@1c7f2d610441d952004b6d96c7c8aad2d2242920
        with:
          summary-json: '{"jobs":[{"unit":"request","execution":"tag event
            handoff","rawResult":"${{ needs.request.result
            }}","applicable":true,"reason":"request job result: ${{
            needs.request.result }}"}]}'
