name: validate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved release version
        required: true
        type: string
      range_kind:
        description: Approved release range kind
        required: true
        type: choice
        options:
          - initial
          - continuing
      from:
        description: Previous release tag; leave empty for an initial release
        required: false
        type: string
      to:
        description: Release tag at the end of the approved range
        required: true
        type: string
      tag:
        description: Approved release tag
        required: true
        type: string
      target_commit:
        description: Approved release commit SHA
        required: true
        type: string
      target:
        description: Approved publication target
        required: true
        default: GitHub Release
        type: string
      release_notes:
        description: Approved GitHub Release body
        required: true
        type: string
      approval:
        description: Confirm that the release inputs and notes are approved
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  request:
    name: validate / release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record release request
        env:
          REQUEST_APPROVAL: ${{ toJSON(inputs.approval) }}
          REQUEST_CONTROL_SHA: ${{ github.sha }}
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_FROM: ${{ inputs.from }}
          REQUEST_RANGE_KIND: ${{ inputs.range_kind }}
          REQUEST_RELEASE_NOTES: ${{ inputs.release_notes }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_TAG: ${{ inputs.tag }}
          REQUEST_TARGET: ${{ inputs.target }}
          REQUEST_TARGET_COMMIT: ${{ inputs.target_commit }}
          REQUEST_TO: ${{ inputs.to }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: |
          jq -n \
            --argjson approval "$REQUEST_APPROVAL" \
            --arg control_sha "$REQUEST_CONTROL_SHA" \
            --arg event "$REQUEST_EVENT" \
            --arg from "$REQUEST_FROM" \
            --arg range_kind "$REQUEST_RANGE_KIND" \
            --arg release_notes "$REQUEST_RELEASE_NOTES" \
            --arg repository "$REQUEST_REPOSITORY" \
            --arg run_id "$REQUEST_RUN_ID" \
            --arg tag "$REQUEST_TAG" \
            --arg target "$REQUEST_TARGET" \
            --arg target_commit "$REQUEST_TARGET_COMMIT" \
            --arg to "$REQUEST_TO" \
            --arg version "$REQUEST_VERSION" \
            '{approval: $approval, control_sha: $control_sha, event: $event, from: (if $from == "" then null else $from end), "range-kind": $range_kind, release_notes: $release_notes, repository: $repository, run_id: $run_id, tag: $tag, target: $target, target_commit: $target_commit, to: $to, version: $version}' \
            > release-request.json
      - name: Upload release request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request
          path: release-request.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
