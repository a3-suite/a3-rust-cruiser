name: ci-post-merge

on:
  push:
    branches:
      - develop
      - "develop/**"
      - main
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  quality:
    name: ci-post-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Validate CI scripts
        run: bash -n .ci/scripts/*.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Run minimal-project smoke test
        run: |
          cargo run --locked -- check examples/minimal-project \
            --policy examples/minimal-project/boundary-policy.yaml \
            --package minimal-project \
            --target bin:minimal-project \
            --target-triple "$(rustc -vV | sed -n 's/^host: //p')" \
            --format text
