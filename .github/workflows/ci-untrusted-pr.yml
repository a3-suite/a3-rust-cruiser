name: ci-untrusted-pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-untrusted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-bootstrap:
    name: ci-trusted-bootstrap
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout base identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Detect initial trusted CI bootstrap
        id: bootstrap
        run: |
          if [[ -f base/.github/workflows/ci-trusted.yml ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout same-repository bootstrap source
        if: ${{ steps.bootstrap.outputs.required == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - name: Run initial trusted CI bootstrap
        if: ${{ steps.bootstrap.outputs.required == 'true' }}
        working-directory: source
        run: |
          bash .ci/scripts/verify-ci-tools.sh ubuntu-24.04
          rustup toolchain install --no-self-update
          bash .ci/scripts/verify-rust-toolchain.sh
          bash -n .ci/scripts/*.sh .ci/tests/*.sh
          bash .ci/tests/run-ci-contract-tests.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

  quality:
    name: ci-untrusted-pr
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI tool versions
        run: bash .ci/scripts/verify-ci-tools.sh ubuntu-24.04
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Verify Rust toolchain
        run: bash .ci/scripts/verify-rust-toolchain.sh
      - name: Validate CI scripts
        run: bash -n .ci/scripts/*.sh
      - name: Run CI contract tests
        run: bash .ci/tests/run-ci-contract-tests.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
