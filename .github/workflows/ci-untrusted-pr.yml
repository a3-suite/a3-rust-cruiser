name: ci-untrusted-pr

on:
  pull_request:
    branches:
      - develop
      - "develop/**"
      - main
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

concurrency:
  group: ci-untrusted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci-untrusted-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Verify Rust toolchain
        run: bash .ci/scripts/verify-rust-toolchain.sh
      - name: Validate CI scripts
        run: bash -n .ci/scripts/*.sh
      - name: Run CI contract tests
        run: bash .ci/tests/release-authority-contract-test.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
